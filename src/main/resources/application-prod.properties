# Activated with SPRING_PROFILES_ACTIVE=prod
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Off by default in production. Turn on for the very first deploy to load your questions.
app.seed.enabled=${APP_SEED_ENABLED:false}

logging.level.root=INFO
server.error.include-stacktrace=never
server.error.include-message=never

# Small pool: the free host has little memory and the free database has connection limits.
# Idle connections are closed before the database's 5-minute auto-suspend.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000